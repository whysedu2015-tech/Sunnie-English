<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUDA 10분 · 오늘의 인증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F6F8F4; --ink:#17302C; --ink-2:#5A6B67; --line:#D9E1DC;
  --green:#1F7A63; --green-soft:#DDEFE7; --sun:#F2C14E; --sun-soft:#FBEFC9;
  --rose:#E36F6A; --white:#fff;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:20px 20px 40px}
.screen.on{display:flex}

/* ── 상단 진행 표시 ── */
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.day{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.day small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:4px}
.streak{font-size:14px;color:var(--ink-2)}
.streak b{color:var(--green);font-weight:700}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:12px 0 22px}
.dot{aspect-ratio:1;border-radius:6px;background:var(--line)}
.dot.done{background:var(--green)}
.dot.today{background:var(--sun);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--sun)}

/* ── 문장 카드 ── */
.card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 var(--line)}
.card + .card{margin-top:12px}
.eyebrow{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:4px}
.word{background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}
.word span{font-weight:500;opacity:.75;margin-left:5px}
.line{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:0}
.role{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--ink);color:#fff;margin-top:2px}
.role.b{background:var(--sun);color:var(--ink)}
.en{font-size:17px;font-weight:600;line-height:1.4}
.ko{font-size:14px;color:var(--ink-2);margin-top:2px}

/* ── 미션 체크 ── */
.mission{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.mission label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--paper)}
.mission input{width:22px;height:22px;accent-color:var(--green)}
.mission b{font-weight:600;white-space:nowrap}
.mission em{font-style:normal;color:var(--ink-2);font-size:13px;margin-left:auto;white-space:nowrap}

/* ── 버튼 ── */
.cta{margin-top:auto;padding-top:22px}
.btn{width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:700;background:var(--green);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--white);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.4}
.hint{font-size:13px;color:var(--ink-2);text-align:center;margin-top:10px}

/* ── 녹음 ── */
.rec-block{margin-top:12px}
.rec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.rec-head h3{font-size:16px;font-weight:700}
.rec-head span{font-size:13px;color:var(--ink-2)}
.script-mini{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.script-mini p{padding:2px 0}
.script-mini p b{display:inline-block;width:18px;color:var(--ink-2);font-weight:600}
.recorder{display:flex;align-items:center;gap:14px;margin-top:12px}
.mic{width:64px;height:64px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(227,111,106,.35);transition:transform .15s}
.mic.rec{animation:pulse 1.2s ease-in-out infinite}
.mic svg{width:26px;height:26px}
.mic.done{background:var(--green);box-shadow:0 6px 18px rgba(31,122,99,.3)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.rec-state{flex:1}
.rec-state .t{font-size:16px;font-weight:700}
.rec-state .s{font-size:13px;color:var(--ink-2)}
.rec-state audio{width:100%;height:32px;margin-top:6px}
.guide{background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:10px}
.guide b{color:var(--ink);font-weight:700}
.guide ul{margin:6px 0 0 18px;font-size:13px;color:var(--ink-2)}
.waiting{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.fb .ai{font-size:12px;color:var(--ink-2);margin-top:10px;text-align:center}

/* ── 피드백 ── */
.stamp{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--radius);background:var(--ink);color:#fff}
.stamp .check{width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none}
.stamp .check svg{width:24px;height:24px}
.stamp h2{font-size:20px;font-weight:800;line-height:1.2}
.stamp p{font-size:13px;opacity:.8;margin-top:2px}
.fb{margin-top:12px}
.fb .card{border-left:5px solid var(--green)}
.fb .card.sun{border-left-color:var(--sun)}
.fb .card.rose{border-left-color:var(--rose)}
.fb h4{font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.fb p{font-size:16px;line-height:1.55}
.fb s{color:var(--rose);text-decoration-thickness:2px}
.fb ins{text-decoration:none;color:var(--green);font-weight:700}
.fb .heard{background:var(--sun-soft);padding:0 4px;border-radius:4px}

/* ── 시작 화면 ── */
.hello{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:28px 0 6px}
.sub{color:var(--ink-2);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
.field input:focus{outline:none;border-color:var(--green)}
.msg{font-size:13px;margin-top:6px;min-height:18px}
.msg.ok{color:var(--green)} .msg.no{color:var(--rose)}
.linkbtn{display:block;width:100%;text-align:center;margin-top:12px;font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.who{display:flex;justify-content:flex-end;margin-bottom:4px}
.who button{font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* ── 테스트 바 ── */
.testbar{position:sticky;top:0;z-index:5;background:#FFF4D6;border-bottom:1px solid #F2D58A;font-size:12px;padding:6px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.testbar select{font-size:12px;padding:2px 4px;border-radius:6px;border:1px solid #E5C46A;background:#fff}
</style>
</head>
<body>
<div class="app">

<div class="testbar" id="testbar" style="display:none">
  <b>테스트 모드</b>
  <label>DAY <select id="daySel"></select></label>
  <span id="dayType"></span>
  <span style="margin-left:auto;opacity:.7">DAY 강제 지정 · 저장은 실제로 됨</span>
</div>

<!-- 0. 시작: 가입 / 다시 들어오기 -->
<section class="screen on" id="s0">
  <h1 class="hello">SUDA 10분,<br>오늘도 인증해요.</h1>
  <p class="sub" id="s0sub">처음이면 아래를 채워 주세요. 1분이면 끝나요.</p>

  <div class="card" id="joinBox">
    <div class="field"><label>이름</label><input id="jName" placeholder="실명" autocomplete="name"></div>
    <div class="field"><label>닉네임</label><input id="jNick" placeholder="화면에 보일 이름 (영어·한글 2~10자)" autocomplete="off" oninput="nickCheck()"><div class="msg" id="nickMsg"></div></div>
    <div class="field"><label>전화번호</label><input id="jPhone" placeholder="010-0000-0000" inputmode="tel" autocomplete="tel"></div>
    <button class="btn" id="joinBtn" onclick="join()" disabled style="margin-top:8px">시작하기</button>
    <button class="linkbtn" onclick="showLogin()">이미 가입했어요</button>
  </div>

  <div class="card" id="loginBox" style="display:none">
    <div class="field"><label>닉네임</label><input id="lNick" autocomplete="off"></div>
    <div class="field"><label>전화번호 뒷 4자리</label><input id="lPhone" inputmode="numeric" maxlength="4" placeholder="0000"></div>
    <div class="msg" id="loginMsg"></div>
    <button class="btn" onclick="login()" style="margin-top:8px">들어가기</button>
    <button class="linkbtn" onclick="showJoin()">처음이에요</button>
  </div>
</section>

<!-- 1. 오늘의 문장 -->
<section class="screen" id="s1">
  <div class="who"><span style="font-size:12px;color:var(--ink-2);margin-right:auto" id="whoNick"></span><button onclick="logout()">다른 사람이에요</button></div>
  <div class="top">
    <div class="day">DAY <span id="dayNum">1</span><small>/ 20</small></div>
    <div class="streak" id="streak"></div>
  </div>
  <div class="dots" id="dots"></div>

  <div class="card" id="scriptCard"></div>
  <div class="card" id="scriptCard2" style="display:none"></div>

  <div class="card">
    <div class="eyebrow">오늘 10분</div>
    <div class="mission" id="mission"></div>
  </div>

  <div class="cta">
    <button class="btn" id="goRec" onclick="go(2)">녹음하러 가기</button>
    <button class="btn ghost" id="seeFb" onclick="viewToday()" style="display:none;margin-top:10px">오늘 피드백 보기</button>
    <div class="hint" id="hint1"></div>
  </div>
</section>

<!-- 2. 녹음 -->
<section class="screen" id="s2">
  <div class="top"><div class="day">녹음</div><div class="streak" id="recDay"></div></div>
  <div id="recArea"></div>
  <div class="cta">
    <button class="btn" id="submitBtn" onclick="submit()" disabled>인증하기</button>
    <div class="hint">보내면 녹음이 저장되고 인증이 기록됩니다.</div>
  </div>
</section>

<!-- 3. 피드백 -->
<section class="screen" id="s3">
  <div class="stamp">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#17302C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div><h2 id="stampTitle">DAY 1 인증 완료</h2><p id="stampSub"></p></div>
  </div>
  <div class="fb" id="fb"></div>
  <div class="cta">
    <button class="btn ghost" onclick="go(2)">다시 녹음하기</button>
    <div class="hint">처음 녹음도 그대로 저장됩니다. 다시 하는 건 자유예요.</div>
  </div>
</section>

</div>

<script>
// ───────── 설정 ─────────
const SB_URL = "https://puldrhsmkmpoogfmsgwz.supabase.co";
const SB_KEY = "sb_publishable_NQG8zAaw-1tFAX__2GXicA_hTgcCyg9";
const PROGRAM = "pilot1";
const TEST = new URLSearchParams(location.search).has("test");

const H = {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
async function rpc(fn, args){ const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:H,body:JSON.stringify(args)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function sel(table, q){ const r=await fetch(`${SB_URL}/rest/v1/${table}?${q}`,{headers:H}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function ins(table, row){ const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:"POST",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify(row)}); if(!r.ok) throw new Error(await r.text()); }
async function upload(path, blob){ const r=await fetch(`${SB_URL}/storage/v1/object/recordings/${path}`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":blob.type||"audio/webm"},body:blob}); if(!r.ok) throw new Error(await r.text()); return path; }

const $ = s => document.querySelector(s);
let SCHEDULE = [], SCRIPTS = {};
let state = {member:null, day:1, doneDays:[], recs:{}, attempt:1};

// ───────── 날짜 → DAY (주말 제외, 시작일 = DAY 1) ─────────
function calcDay(startedOn){
  const s=new Date(startedOn+"T00:00:00"), t=new Date(); t.setHours(0,0,0,0);
  let d=0; for(let x=new Date(s); x<=t; x.setDate(x.getDate()+1)){ const w=x.getDay(); if(w!==0&&w!==6) d++; }
  return Math.min(Math.max(d,1),20);
}
function plan(day){
  const row = SCHEDULE.find(r=>r.day===day); if(!row) return null;
  const A=SCRIPTS[row.script_a], B=SCRIPTS[row.script_b], t=row.type, wd=(day-1)%5;
  return {week:Math.ceil(day/5), wd, A, B, type:t, script:t.startsWith("A")?A:(t.startsWith("B")?B:null),
    label:{A:"낭독",A_MY:"낭독 + MY SENTENCE",B:"낭독",B_MY:"낭독 + MY SENTENCE",MY2:"복습 · MY SENTENCE"}[t]};
}

// ───────── 시작: 편성표·스크립트 불러오기 ─────────
async function boot(){
  try{
    SCHEDULE = await sel("schedule", `program=eq.${PROGRAM}&order=day`);
    const ids=[...new Set(SCHEDULE.flatMap(r=>[r.script_a,r.script_b]))];
    const rows=await sel("scripts", `id=in.(${ids.join(",")})`);
    rows.forEach(s=>SCRIPTS[s.id]={...s, order:s.ord});
  }catch(e){ $("#s0sub").textContent="연결이 잘 안 돼요. 잠시 후 다시 열어 주세요."; console.error(e); return; }
  if(TEST){ $("#testbar").style.display="flex"; for(let d=1;d<=20;d++){ const o=document.createElement("option"); o.value=d; o.textContent=d; $("#daySel").appendChild(o);} $("#daySel").onchange=e=>{ state.day=+e.target.value; state.recs={}; render1(); go(1); }; }
  let saved=null; try{ saved=JSON.parse(localStorage.getItem("suda_member")||"null"); }catch(e){}
  if(saved && saved.id){ await enter(saved); }
}

// ───────── 가입 / 로그인 ─────────
function showLogin(){ $("#joinBox").style.display="none"; $("#loginBox").style.display="block"; $("#s0sub").textContent="닉네임과 전화번호 뒷 4자리로 들어옵니다."; }
function showJoin(){ $("#loginBox").style.display="none"; $("#joinBox").style.display="block"; $("#s0sub").textContent="처음이면 아래를 채워 주세요. 1분이면 끝나요."; }
let nickTimer=null;
function nickCheck(){
  const v=$("#jNick").value.trim(), m=$("#nickMsg"); m.className="msg"; $("#joinBtn").disabled=true;
  if(!v){ m.textContent=""; return; }
  if(v.length<2||v.length>10){ m.textContent="2~10자로 해 주세요"; m.className="msg no"; return; }
  m.textContent="확인 중…"; clearTimeout(nickTimer);
  nickTimer=setTimeout(async()=>{
    try{ const ok=await rpc("nickname_available",{p_nick:v});
      if($("#jNick").value.trim()!==v) return;
      if(ok){ m.textContent="사용할 수 있어요"; m.className="msg ok"; $("#joinBtn").disabled=false; }
      else { m.textContent="이미 쓰는 닉네임이에요. 다른 걸로 해 주세요"; m.className="msg no"; }
    }catch(e){ m.textContent="확인이 안 돼요. 다시 입력해 보세요"; m.className="msg no"; }
  },400);
}
async function join(){
  const name=$("#jName").value.trim(), nick=$("#jNick").value.trim(), phone=$("#jPhone").value.replace(/\D/g,"");
  if(!name){ alert("이름을 입력해 주세요"); return; }
  if(phone.length<10){ alert("전화번호를 확인해 주세요"); return; }
  $("#joinBtn").disabled=true; $("#joinBtn").textContent="등록 중…";
  try{ const id=await rpc("join_member",{p_name:name,p_nick:nick,p_phone:phone});
    await enter({id, nickname:nick, started_on:new Date().toISOString().slice(0,10)});
  }catch(e){ alert("등록이 안 됐어요. 닉네임이 방금 다른 분이 쓰셨을 수 있어요."); console.error(e); }
  $("#joinBtn").disabled=false; $("#joinBtn").textContent="시작하기";
}
async function login(){
  const nick=$("#lNick").value.trim(), last=$("#lPhone").value.trim(), m=$("#loginMsg");
  try{ const r=await rpc("login_member",{p_nick:nick,p_last4:last});
    if(r&&r.length){ await enter(r[0]); } else { m.textContent="닉네임 또는 번호가 맞지 않아요"; m.className="msg no"; }
  }catch(e){ m.textContent="연결이 잘 안 돼요"; m.className="msg no"; }
}
async function enter(mem){
  state.member=mem; try{ localStorage.setItem("suda_member",JSON.stringify(mem)); }catch(e){}
  $("#whoNick").textContent=mem.nickname+"님";
  if(!TEST) state.day=calcDay(mem.started_on);
  try{ state.doneDays=await rpc("my_progress",{p_member:mem.id}); }catch(e){ state.doneDays=[]; }
  render1(); go(1);
}
function logout(){ try{ localStorage.removeItem("suda_member"); }catch(e){} state.member=null; showLogin(); go(0); }

function go(n){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#s"+n).classList.add("on"); window.scrollTo(0,0); if(n===2) render2(); }

// ───────── 화면 1 ─────────
function scriptHTML(s, full=true){
  return `<div class="eyebrow">스크립트 ${s.order}</div><div class="title">${s.title}</div>
  ${full?`<div class="words">${s.words.map(w=>`<span class="word">${w.en}<span>${w.ko}</span></span>`).join("")}</div><div style="height:14px"></div>`:""}
  ${s.dialogue.map(d=>`<div class="line"><div class="role ${d.role==="B"?"b":""}">${d.role}</div><div><div class="en">${d.en}</div><div class="ko">${d.ko}</div></div></div>`).join("")}`;
}
function render1(){
  const p=plan(state.day); if(!p) return;
  $("#dayNum").textContent=state.day;
  $("#dayType").textContent=`${p.week}주차 ${"월화수목금"[p.wd]} · ${p.label}`;
  const streak=(()=>{let c=0; for(let d=state.day-1; d>=1&&state.doneDays.includes(d); d--) c++; return c;})();
  const doneToday=state.doneDays.includes(state.day);
  $("#streak").innerHTML = doneToday ? `<b>오늘 인증 완료</b>` : streak? `<b>${streak}일</b> 연속` : (state.day>1?"다시 시작하는 날":"첫날");
  $("#dots").innerHTML=Array.from({length:20},(_,i)=>{const d=i+1; return `<div class="dot ${state.doneDays.includes(d)?"done":""} ${d===state.day?"today":""}"></div>`;}).join("");
  if(p.type==="MY2"){
    $("#scriptCard").innerHTML=`<div class="eyebrow">이번 주 두 스크립트</div><div class="title">${p.A.title} · ${p.B.title}</div><div class="ko">오늘은 낭독 없이, 두 대화의 표현으로 내 문장만 만들어 말합니다.</div>`;
  } else { $("#scriptCard").innerHTML=scriptHTML(p.script); }
  const m={A:[["SUDA 학습","7분","단어와 대화를 소리 내어 따라 읽기"],["인증","3분","대화 전체를 한 번에 녹음"]],
    A_MY:[["SUDA 학습","5분","대화 다시 읽기"],["MY SENTENCE","3분","대화문 표현으로 내 문장 3개 이상"],["인증","2분","원문 한 번 + 내 문장 이어서 녹음"]],
    MY2:[["복습","4분","이번 주 두 대화 다시 읽기"],["MY SENTENCE","4분","두 대화 표현으로 내 문장 3개 이상"],["인증","2분","내 문장 이어서 녹음"]]};
  m.B=m.A; m.B_MY=m.A_MY;
  $("#mission").innerHTML=m[p.type].map(([t,min,d])=>`<label><input type="checkbox"><b>${t}</b><span class="ko" style="margin-top:0">${d}</span><em>${min}</em></label>`).join("");
  $("#hint1").textContent = doneToday ? "오늘은 이미 인증했어요. 다시 녹음해도 돼요." : (p.type==="A"||p.type==="B" ? "오늘은 대화 전체를 한 번 녹음하면 끝." : "");
  $("#goRec").textContent = doneToday ? "다시 녹음하기" : "녹음하러 가기";
  $("#seeFb").style.display = doneToday ? "block" : "none";
}
async function viewToday(){
  const b=$("#seeFb"); b.disabled=true; b.textContent="불러오는 중…";
  try{
    const r=await rpc("my_latest_feedback",{p_member:state.member.id,p_day:state.day}); const f=r&&r[0];
    if(!f){ alert("아직 저장된 피드백이 없어요."); }
    else if(f.feedback_status==="done"&&f.feedback&&f.feedback.cards){ openStamp(); go(3); renderCards(f.feedback.cards); }
    else if(f.feedback_status==="pending"){ startPolling(f.id); }
    else { openStamp(); go(3); fbFallback(); }
  }catch(e){ alert("불러오지 못했어요. 잠시 후 다시 눌러 주세요."); console.error(e); }
  b.disabled=false; b.textContent="오늘 피드백 보기";
}

// ───────── 화면 2 ─────────
function render2(){
  const p=plan(state.day);
  $("#recDay").textContent=`DAY ${state.day} · ${p.label}`;
  const mini=s=>`<div class="script-mini">${s.dialogue.map(d=>`<p><b>${d.role}</b>${d.en}</p>`).join("")}</div>`;
  const guide=(t,tips)=>`<div class="guide">${t}<ul>${tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  let blocks=[];
  if(p.type==="A"||p.type==="B"){ blocks.push({id:"read",h:"대화 전체 낭독",s:"A와 B 모두 내 목소리로",body:mini(p.script)}); }
  else if(p.type==="A_MY"||p.type==="B_MY"){
    blocks.push({id:"read",h:"원문 한 번 읽기",s:"가볍게, 익숙해진 만큼만",body:mini(p.script)});
    blocks.push({id:"my",h:"MY SENTENCE",s:"3문장 이상 · 이어서",body:guide("오늘 대화문의 표현을 골라 <b>내 이야기 3문장 이상</b>을 한 번에 이어서 말해요.",["어느 문장의 표현을 써도 좋아요. 여러 개 섞어도 돼요.","완벽하지 않아도 괜찮아요. 멈추지 않고 말하는 게 목표예요.","AI 코치가 어떤 표현을 썼는지 알아보고 다듬어 드려요."])});
  } else {
    blocks.push({id:"my",h:"MY SENTENCE",s:"3문장 이상 · 이어서",body:mini(p.A)+`<div style="height:8px"></div>`+mini(p.B)+guide("이번 주 두 대화의 표현으로 <b>내 이야기 3문장 이상</b>을 한 번에 이어서 말해요.",["두 대화 표현을 섞어 써도 좋아요.","짧아도 괜찮아요. 본인 이야기면 충분해요."])});
  }
  $("#recArea").innerHTML=blocks.map(b=>`
    <div class="card rec-block" data-id="${b.id}">
      <div class="rec-head"><h3>${b.h}</h3><span>${b.s}</span></div>
      ${b.body||""}
      <div class="recorder">
        <button class="mic" onclick="toggleRec('${b.id}')" aria-label="녹음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div class="rec-state"><div class="t">눌러서 녹음</div><div class="s">다시 누르면 멈춰요</div></div>
      </div>
    </div>`).join("");
  state.recs={}; check();
}
let media={rec:null};
async function toggleRec(id){
  const block=document.querySelector(`[data-id="${id}"]`), mic=block.querySelector(".mic"), st=block.querySelector(".rec-state");
  if(media.rec&&media.id===id){ media.rec.stop(); return; }
  if(media.rec) return;
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ st.querySelector(".t").textContent="마이크 권한이 필요해요"; st.querySelector(".s").textContent="브라우저 설정에서 마이크를 허용해 주세요"; return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  const rec=new MediaRecorder(stream, mime?{mimeType:mime}:{}); media={rec,id,chunks:[],t0:Date.now()};
  rec.ondataavailable=e=>media.chunks.push(e.data);
  rec.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(media.chunks,{type:rec.mimeType}), sec=Math.round((Date.now()-media.t0)/1000);
    state.recs[id]={blob,sec,ext:rec.mimeType.includes("mp4")?"m4a":"webm"};
    clearInterval(media.timer); media={rec:null};
    mic.classList.remove("rec"); mic.classList.add("done");
    st.innerHTML=`<div class="t">녹음됨 · ${sec}초</div><div class="s">다시 누르면 새로 녹음</div><audio controls src="${URL.createObjectURL(blob)}"></audio>`;
    check();
  };
  rec.start(); mic.classList.add("rec"); mic.classList.remove("done");
  st.innerHTML=`<div class="t">녹음 중 · <span id="tm">0</span>초</div><div class="s">다 읽었으면 눌러서 멈추기</div>`;
  media.timer=setInterval(()=>{const el=$("#tm"); if(el) el.textContent=Math.round((Date.now()-media.t0)/1000);},500);
}
function check(){
  const p=plan(state.day); const has=id=>!!state.recs[id];
  let ok;
  if(p.type==="A"||p.type==="B") ok=has("read");
  else if(p.type==="MY2") ok=has("my");
  else ok=has("read")&&has("my");
  $("#submitBtn").disabled=!ok;
}

// ───────── 제출: 파일 올리고 기록 ─────────
async function submit(){
  const p=plan(state.day), btn=$("#submitBtn"); btn.disabled=true; btn.textContent="올리는 중…";
  const ts=Date.now(), safeNick=state.member.nickname.replace(/[^A-Za-z0-9_-]/g,""), id8=state.member.id.slice(0,8), base=`${safeNick?safeNick+"_":""}${id8}/day${String(state.day).padStart(2,"0")}_${ts}`;
  try{
    let reading_path=null, my=[];
    if(state.recs.read){ reading_path=await upload(`${base}_read.${state.recs.read.ext}`, state.recs.read.blob); }
    if(state.recs.my){
      const path=await upload(`${base}_my.${state.recs.my.ext}`, state.recs.my.blob);
      my.push({audio_path:path, sec:state.recs.my.sec});
    }
    const attempt=(state.doneDays.includes(state.day)?2:1)+(state.attempt-1);
    const id=crypto.randomUUID();
    await ins("submissions",{id, member_id:state.member.id, day:state.day, type:p.type, attempt, reading_path, my_sentences:my.length?my:null});
    state.attempt++;
    state.doneDays=[...new Set([...state.doneDays,state.day])].sort((a,b)=>a-b);
    showFeedback(p, id);
  }catch(e){ alert("올리는 데 실패했어요.\n\n[오류 내용]\n"+String(e.message||e).slice(0,300)); console.error(e); }
  btn.disabled=false; btn.textContent="인증하기";
}
let pollTimer=null;
function esc(t){ return String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(t){ return esc(t).replace(/~~(.+?)~~/g,"<s>$1</s>").replace(/\*\*(.+?)\*\*/g,"<ins>$1</ins>").replace(/\n/g,"<br>"); }
function openStamp(){
  $("#stampTitle").textContent=`DAY ${state.day} 인증 완료`;
  $("#stampSub").textContent=`${state.member.nickname}님, 오늘도 멈추지 않았어요.`;
}
function showFeedback(p, id){ render1(); startPolling(id); }
function startPolling(id){
  openStamp();
  $("#fb").innerHTML=`<div class="card"><div class="waiting"><div class="spin"></div><p>AI 코치가 녹음을 듣고 있어요. 30초쯤 걸려요.</p></div></div>`;
  go(3);
  clearInterval(pollTimer); let tries=0;
  pollTimer=setInterval(async()=>{
    tries++;
    try{
      const r=await rpc("my_feedback",{p_submission:id}); const f=r&&r[0];
      if(f&&f.feedback_status==="done"&&f.feedback&&f.feedback.cards){ clearInterval(pollTimer); renderCards(f.feedback.cards); return; }
      if(f&&f.feedback_status==="error"){ clearInterval(pollTimer); fbFallback(); return; }
    }catch(e){ console.error(e); }
    if(tries>=40){ clearInterval(pollTimer); fbFallback(); }
  },3000);
}
function renderCards(cards){
  const cls={reading:"",pron:"sun",my:"sun",encourage:"rose"};
  $("#fb").innerHTML=cards.map(c=>`<div class="card ${cls[c.kind]||""}"><h4>${esc(c.title||"")}</h4><p>${md(c.body||"")}</p></div>`).join("")
    +`<div class="ai">AI 코치가 먼저 들었어요. 선생님은 주간 Zoom에서 정리해 드려요.</div>`;
}
function fbFallback(){
  $("#fb").innerHTML=`<div class="card"><h4>피드백</h4><p>녹음은 잘 저장됐어요. 피드백은 조금 늦게 준비되거나, 이번 주 Zoom에서 선생님이 정리해 드려요.</p></div>`;
}
boot();
</script>
